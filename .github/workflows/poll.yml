name: Poll chess-results

on:
  schedule:
    # Every 10 minutes. GitHub's cron floor is 5 minutes and scheduled runs are
    # routinely delayed 5-20 minutes under load, so treat this as "roughly every
    # 10-25 minutes", not a guarantee.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and diff, but send no push and write no files'
        type: boolean
        default: false

# Only one poll at a time: two concurrent runs would race on the state commit.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Poll and notify
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/poll.js

      - name: Commit data, only if it changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'pairingnotify[bot]'
          git config user.email 'pairingnotify@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "No change; nothing to commit."
          else
            git commit -m "data: refresh pairings"
            # The schedule fires every 10 minutes while a run may take longer, so
            # rebase rather than fail on a racing commit.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push attempt $attempt failed; retrying"
              sleep $((attempt * 5))
            done
            exit 1
          fi
