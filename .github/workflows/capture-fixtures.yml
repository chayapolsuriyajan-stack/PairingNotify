name: Capture chess-results fixtures

# Downloads raw chess-results HTML from a runner and reports whether each parser still
# works against today's markup. Runs every Monday on a known event, so a markup change
# shows up as a failed run (GitHub emails you) before it breaks a tournament weekend.
# Run it by hand with any event, too, whenever the poller starts failing to parse.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      tournament:
        description: 'Tournament id, the number in https://chess-results.com/tnr<id>.aspx'
        required: true
      name:
        description: 'Player name to look for (optional if you pass a start number)'
        required: false
      snr:
        description: 'Start number, skips the name lookup (optional)'
        required: false

env:
  # The scheduled run's event (a finished open that stays online).
  DEFAULT_TOURNAMENT: '1486488'
  DEFAULT_NAME: 'Habla, Jony'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Capture
        env:
          TOURNAMENT: ${{ inputs.tournament || env.DEFAULT_TOURNAMENT }}
          NAME: ${{ inputs.tournament && inputs.name || (!inputs.tournament && env.DEFAULT_NAME) || '' }}
          SNR: ${{ inputs.snr || '' }}
        run: |
          args=(--tournament "$TOURNAMENT")
          [ -n "$NAME" ] && args+=(--name "$NAME")
          [ -n "$SNR" ] && args+=(--snr "$SNR")
          node scripts/capture-fixtures.js "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-results-fixtures
          path: lib/__fixtures__/captured/
          if-no-files-found: warn
